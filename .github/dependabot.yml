version: 2

updates:
  # Go module deps — weekly so the PR queue stays light. release-please
  # cycles every few weeks; aligning dependency churn with that rhythm
  # avoids the daily-PR avalanche from `daily` cadence.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # Group bubbletea + lipgloss + bubbles together — they release in
      # lockstep and a Dependabot PR per package is wasted churn.
      charmbracelet:
        patterns:
          - "github.com/charmbracelet/*"
      # Cobra + viper + spf13 stuff travels together for the same reason.
      spf13:
        patterns:
          - "github.com/spf13/*"

  # GitHub Actions — pin updates against breaking changes in v5/v6/etc.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - ci
