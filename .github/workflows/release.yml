name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  # Re-run the full quality gate as a publish gate. release-please's
  # tag-push lands directly on main without a PR cycle, so this is the
  # last line of defense against shipping a bad cut.
  checks:
    uses: ./.github/workflows/ci-checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    secrets: inherit

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary="ws-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o "${binary}" ./cmd/ws
          tar czf "${binary}.tar.gz" "${binary}"

      - uses: actions/upload-artifact@v4
        with:
          name: ws-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ws-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
