# Thresholds for the perf benchmark protocol. See AGENTS.md "Performance
# Protocol" for how these are consumed by `just bench-compare`.
#
# Δ% values are absolute deltas (e.g. `5` means "5% slower than baseline").
# `p_max` is the maximum p-value below which a delta is considered
# statistically meaningful (Mann-Whitney via benchstat).

[L1]
# Microbenchmarks (go test -bench). Tightest gate — pure Go regressions
# are usually intentional or a measurable mistake.
time_pct = 5
allocs_pct = 10
p_max = 0.05

[L2]
# Macrobenchmarks against a synthetic workspace via internal/benchfixture.
# Wider tolerance: subprocess git invocation noise is real.
time_pct = 10
allocs_pct = 15
p_max = 0.05

[L3]
# E2E hyperfine scenarios on the actual binary. Trend-only; never gates.
time_pct = 0    # advisory only
rss_pct = 0     # advisory only
