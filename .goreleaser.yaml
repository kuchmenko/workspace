version: 2

project_name: ws

before:
  hooks:
    - go mod tidy

builds:
  - id: ws
    main: ./cmd/ws
    binary: "ws-{{ .Os }}-{{ .Arch }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: ws
    formats: [tar.gz]
    name_template: "ws-{{ .Os }}-{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  gitea:
    owner: kuchmenko
    name: workspace

gitea_urls:
  api: https://codeberg.org/api/v1
  download: https://codeberg.org
