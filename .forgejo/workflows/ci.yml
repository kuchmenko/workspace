name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job: the self-hosted runner has capacity 1, so splitting into a matrix
# only serialises with repeated Go installs. Steps are ordered cheap -> slow.
# Actions are pinned by full URL because this runs on Codeberg's Forgejo, not
# GitHub. golangci-lint/govulncheck run as binaries (no GitHub Code Scanning
# to upload SARIF to).
jobs:
  ci:
    runs-on: linux-amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: git config --global --add safe.directory '*'

      - name: gofmt -l (must be empty)
        run: |
          set -eo pipefail
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out" | sed 's/^/  /'
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (must be clean)
        run: |
          set -eo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        run: |
          set -eo pipefail
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m

      - name: build + install smoke
        run: |
          set -eo pipefail
          go build ./...
          go install ./cmd/ws
          "$(go env GOPATH)/bin/ws" --help > /dev/null

      - name: test (race + coverage)
        run: |
          set -eo pipefail
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ws-ci"
          git config --global init.defaultBranch main
          go test -race -timeout 5m -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          go tool cover -html=coverage.out -o coverage.html

      - name: govulncheck
        run: |
          set -eo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: upload coverage
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: coverage
          path: coverage.html
          retention-days: 14
