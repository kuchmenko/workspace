name: releaser-pleaser

# Maintains a "Release PR" from conventional commits on main; on merge it tags
# vX.Y.Z and creates the Codeberg release (notes only — assets are built by the
# tag-triggered release workflow). Needs a PAT (the built-in token can't
# re-trigger the downstream release workflow).
on:
  push:
    branches: [main]

concurrency:
  group: releaser-pleaser
  cancel-in-progress: true

jobs:
  releaser-pleaser:
    runs-on: linux-amd64
    steps:
      - name: releaser-pleaser
        uses: https://github.com/apricote/releaser-pleaser@v0.8.0
        with:
          forge: forgejo
          api-url: https://codeberg.org
          owner: kuchmenko
          repo: workspace
          token: ${{ secrets.RELEASER_PLEASER_TOKEN }}
