name: Release

on:
  push:
    tags:
      - "v*"

# GoReleaser cross-compiles linux/darwin amd64/arm64, builds the changelog from
# commits, creates the Codeberg release and uploads the tar.gz + checksums.
# GITEA_TOKEN is the built-in per-job token; GORELEASER_FORCE_TOKEN=gitea makes
# GoReleaser target Codeberg instead of GitHub.
jobs:
  release:
    runs-on: linux-amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
