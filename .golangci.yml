# golangci-lint v2 configuration. Tier-1 quality gate.
#
# Strictness calibrated against the codebase as it lands today. Tkach
# does the same — its clippy.toml force-warns cognitive_complexity and
# too_many_lines below the strict global cap, accepting that two
# specific rules are advisory while everything else is failing.
#
# Linters that surface high-noise / low-signal findings on a CLI tool
# of this shape (revive's exported-doc-comment rule, exhaustive on
# weak Go enums, prealloc micro-opts, gocritic style nits) are
# disabled. They can come back in dedicated cleanup PRs once the
# obvious wins are picked.
#
# v2 schema docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Default-recommended set
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Tier-1 additions that earn their keep on this codebase
    - gosec        # security; with explicit excludes for inherent-CLI patterns
    - gocognit     # cognitive complexity (mirrors tkach's clippy threshold)
    - gocyclo      # cyclomatic complexity (secondary signal — different metric)
    - funlen       # function length (mirrors tkach's too-many-lines)
    - bodyclose    # http response body close
    - durationcheck
    - errorlint    # errors.As / errors.Is hygiene
    - gocheckcompilerdirectives
    - misspell
    - reassign     # reassigning package-level vars
    - thelper      # t.Helper() in test helpers
    - tparallel    # t.Parallel() correctness
    - unconvert    # unnecessary type conversions
    - usestdlibvars
    - wastedassign
    - whitespace

    # Disabled — see top comment for rationale:
    # - revive    : `exported` rule alone produces 30+ doc-comment chores
    #               with no correctness value on internal code.
    # - exhaustive: Go enums are stringly-typed iotas; "default-signifies-
    #               exhaustive" doesn't catch every case and the rule
    #               fires on intentionally-partial switches.
    # - prealloc  : slice growth is fine for this tool's hot paths.
    # - gocritic  : style nits with high false-positive rate.
    # - funlen    : redundant with gocyclo on this codebase.
    # - predeclared / sqlclosecheck / rowserrcheck : no-op (no SQL).
    # - noctx     : every git exec call would need surgery; deferred to a
    #               dedicated cleanup PR.
    # - nilerr    : best-effort metadata paths intentionally swallow some
    #               errors; case-by-case audit deferred.

  settings:
    gocognit:
      # tkach's clippy.toml: cognitive-complexity-threshold = 7. Same
      # metric as Sonar's cognitive complexity — penalizes nested control
      # flow more heavily than cyclomatic. 7 is strict; offending files
      # are path-excluded below (Bubble Tea reducers, MigrateProject,
      # syncProject) where the switch-on-state pattern is the design.
      min-complexity: 7

    gocyclo:
      # Cyclomatic complexity (decision-point count) — a secondary signal
      # since gocognit is the primary cognitive-complexity check.
      min-complexity: 20

    funlen:
      # tkach's clippy.toml: too-many-lines-threshold = 200.
      lines: 200
      statements: 80

    gosec:
      excludes:
        # Errcheck duplicate.
        - G104
        # Subprocess with variable: we shell out to git everywhere.
        # The variable input is a project / branch name from
        # workspace.toml, not user-supplied untrusted input.
        - G204
        # Command injection via taint: same trust boundary as G204
        # (project/branch names from workspace.toml).
        - G702
        # File inclusion via variable: same provenance — paths come
        # from workspace.toml which is itself a trust boundary.
        - G304
        # Directory / file permissions: 0755/0644 are intentional for
        # the workspace tree (other tools read these dirs).
        - G301
        - G302
        - G306
        # Marshaled struct field "AccessToken": the auth Token struct
        # is our serialized OAuth token — the whole point is to write
        # it. Hardcoded "credential" pattern in OAuth constants is
        # also a false positive (client IDs are public).
        - G101
        - G117
        # Path traversal "via taint": same trust boundary as G304.
        - G703
        # Weak crypto: SHA-1 is used in layout.WorktreePathForBranch
        # for deterministic non-security-sensitive directory-name
        # collision suffixes. Not a key, not a signature, not an
        # identity — just a stable hash. Same reason go's
        # x/crypto/openpgp keeps SHA-1 around.
        - G401
        - G505

    errcheck:
      exclude-functions:
        # Standard cleanup patterns where the close-failure is not
        # actionable. errcheck has no built-in "deferred close"
        # detection; explicit exclusions are the canonical path.
        - (io.Closer).Close
        - (*os.File).Close
        - (*net/http.Response).Body.Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (*net.UnixListener).Close
        - (*net.UnixConn).Close
        - os.Remove
        - os.RemoveAll
        - os.Chmod
        - (*os.Process).Release
        - (*os.Process).Signal
        - (*os/exec.Cmd).Run        # daemon log-tail: best-effort
        - (*os/exec.Cmd).Start
        - (*encoding/json.Decoder).Decode  # in error paths after non-200 HTTP
        - (*encoding/json.Encoder).Encode
        - encoding/json.Unmarshal
        # Best-effort writes to stdout/stderr — pipe-broken / closed-tty
        # conditions are not actionable from here.
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Sscanf
        - (net.Conn).Write
        - (*net.UnixConn).Write
        - (*net.UnixConn).SetReadDeadline
        - (net.Conn).SetReadDeadline
        # Daemon IPC client teardown: best-effort.
        - (*github.com/kuchmenko/workspace/internal/daemon.Client).Stop
        - (*github.com/kuchmenko/workspace/internal/daemon.Client).Notify

    govet:
      # `enable-all` would pull in shadow + fieldalignment which are
      # high-noise. Stick with the curated default + a few additions.
      disable:
        - fieldalignment
        - shadow

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    misspell:
      locale: US

  exclusions:
    rules:
      # Test helpers legitimately have long table-driven setups and
      # exercise edge-case error paths.
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
          - gosec
          - errcheck
          - noctx
      # Generated agent docs JSON / cobra glue is naturally repetitive.
      - path: internal/docs/
        linters:
          - gocyclo
          - gocognit
          - funlen
      # Bubble Tea reducer-style update funcs are switch-heavy by
      # design. Path glob covers every TUI file: agent, aliasmgr,
      # add, create, setup, migrate, bootstrap.
      - path: internal/(agent|aliasmgr|add|create|setup|migrate)/.*\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      - path: internal/cli/.*tui.*\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      - path: internal/cli/(bootstrap|migrate_tui)\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      # MigrateProject is a 280-line orchestration that fans out to
      # the strategy decisions for dirty / stash / detached HEAD; the
      # design is deliberate. Reconciler.syncProject likewise routes
      # every project state class to its handler in a single switch.
      # Both have inline comments explaining each case; refactoring
      # for cognitive complexity alone would obscure the logic.
      - path: internal/migrate/migrate\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      - path: internal/daemon/reconciler\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      # Worktree add command resolves three input cases (existing
      # worktree / existing branch / fresh) plus collision suffix and
      # remote upstream wiring; the switch is the spec.
      - path: internal/cli/worktree\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      # Long cobra command setup with many flags.
      - path: internal/cli/(migrate|root)\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
      # Cobra command-builder funcs (newXxxCmd) wrap argument
      # validation + RunE closures + flag wiring. Cognitive cost
      # comes from the framework shape, not from logic drift.
      # gocyclo / funlen / gocognit on cli/*.go are too punitive
      # for boilerplate that the framework dictates.
      - path: internal/cli/.*\.go
        source: '^func new\w+Cmd\('
        linters:
          - gocyclo
          - gocognit
          - funlen
